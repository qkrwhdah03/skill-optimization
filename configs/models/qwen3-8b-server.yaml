# Qwen3-8B behind a local OpenAI-compatible server (e.g. `vllm serve Qwen/Qwen3-8B --gpu-memory-utilization 0.85`)
# running on the same GPU, so it counts against the VRAM budget.
backend: openai
model: Qwen/Qwen3-8B
tokenizer: Qwen/Qwen3-8B
est_vram_gb: 20.4
engine:
  base_url: http://localhost:8000/v1
  timeout: 600
generation:
  temperature: 0.6
  top_p: 0.95
  top_k: 20
  max_tokens: 8192
  seed: 0
  enable_thinking: true
