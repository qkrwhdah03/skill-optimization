# Qwen3-8B (bf16, ~16 GB weights) on vLLM. Fits a 24 GB GPU; optimizer + target can share this engine.
# bf16 needs compute capability >= 8.0 (Ampere or newer); otherwise use qwen3-8b-fp16-vllm.
backend: vllm
model: Qwen/Qwen3-8B
engine:
  dtype: bfloat16
  gpu_memory_utilization: 0.85
  max_model_len: 16384
generation:
  temperature: 0.6
  top_p: 0.95
  top_k: 20
  max_tokens: 8192
  seed: 0
  enable_thinking: true
